name: Guard truncation and migrations

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Block emptied files and edits to existing migrations
        run: node scripts/check-truncation-and-migrations.mjs --ci
